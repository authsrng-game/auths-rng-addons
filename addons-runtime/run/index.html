<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      const HOST_ORIGIN = "https://authsrng.xyz";
      const ALT_HOST_ORIGIN = "https://nightly.authsrng.xyz";

      let _seq = 0;
      const _pending = new Map();

      function call(method, ...args) {
        return new Promise((resolve, reject) => {
          const id = ++_seq;
          _pending.set(id, { resolve, reject });
          parent.postMessage({ id, method, args }, "*");
        });
      }

      window.addEventListener("message", (e) => {
        if (e.origin !== HOST_ORIGIN && e.origin !== ALT_HOST_ORIGIN) return;
        const { id, result, error } = e.data || {};
        const entry = _pending.get(id);
        if (!entry) return;
        _pending.delete(id);
        if (error) entry.reject(new Error(error));
        else entry.resolve(result);
      });

      window.AddonAPI = { call };

      const path = location.pathname.split("/").filter(Boolean);
      const addonId = path[1];
      const addonVersion = path[2];

      fetch(`/bundles/${addonId}/${addonVersion}/addon.js`)
        .then((r) => {
          if (!r.ok) throw new Error("bundle fetch failed");
          return r.text();
        })
        .then((code) => {
          const script = document.createElement("script");
          script.textContent = code;
          document.body.appendChild(script);
        })
        .catch((err) => console.error("addon load failed", err));
    </script>
  </body>
</html>
